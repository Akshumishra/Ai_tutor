site_name: AI Tutor — Documentation
site_description: Full technical documentation for the AI Tutor platform — agents, database schema, API reference & deployment guide.
site_author: AI Tutor Team
site_url: https://akshumishra.github.io/Ai_tutor/

repo_name: Akshumishra/Ai_tutor
repo_url: https://github.com/Akshumishra/Ai_tutor
edit_uri: edit/main/docs/docs/

theme:
  name: material
  logo: assets/logo.png
  favicon: assets/logo.png
  palette:
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: deep purple
      accent: cyan
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: deep purple
      accent: cyan
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.expand
    - navigation.top
    - navigation.footer
    - search.highlight
    - search.suggest
    - content.tabs.link
    - content.code.copy
    - content.code.annotate
    - toc.follow
  font:
    text: Inter
    code: JetBrains Mono
  icon:
    repo: fontawesome/brands/github

plugins:
  - search
  - mermaid2

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:mermaid2.fence_mermaid_custom
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true

nav:
  - Home: index.md
  - Architecture: architecture.md
  - Setup Guide:
      - Prerequisites: setup/prerequisites.md
      - Backend: setup/backend.md
      - Frontend: setup/frontend.md
      - Docker: setup/docker.md
  - Database:
      - Schema & ER Diagram: database/schema.md
      - Enums Reference: database/enums.md
  - AI Agents:
      - Pipeline Overview: agents/overview.md
      - Curriculum Agent: agents/curriculum.md
      - Planner Agent: agents/planner.md
      - Teacher Agent: agents/teacher.md
      - Deep Research Pipeline: agents/deep_research.md
  - API Reference:
      - Authentication: api/auth.md
      - Agents (SSE): api/agents.md
      - Dashboard: api/dashboard.md
      - Quiz: api/quiz.md
  - Deployment: deployment.md

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/Akshumishra/Ai_tutor
  generator: false

extra_css:
  - stylesheets/extra.css

copyright: Copyright &copy; 2026 AI Tutor Team
